# Compose produksi ACF Workbench di VPS1 (aws1).
# Network "acf_net" khusus ACF; edge_nginx di-attach ke network ini sekali
# (docker network connect acf_net edge_nginx) agar bisa mem-proxy via nama
# container tanpa publish port ke host. Deploy oleh GitLab Runner (tag "vps1").

name: acf

networks:
  acf_net:
    name: acf_net

services:
  backend:
    image: ${BACKEND_IMAGE}
    container_name: acf-backend
    restart: unless-stopped
    networks:
      - acf_net
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      # Produksi: SSRF guard AKTIF, target privat diblokir.
      ALLOW_LOCAL_TARGETS: "false"
      # Opsional: isi CI/CD variable PROXY_API_KEY untuk mengaktifkan x-proxy-key.
      PROXY_API_KEY: "${PROXY_API_KEY:-}"
      # edge_nginx mem-proxy dengan X-Forwarded-For; percayai header itu.
      TRUST_PROXY: "true"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/proxy/execute',{method:'POST',headers:{'content-type':'application/json'},body:'{}'}).then(r=>process.exit(r.status===400?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: acf-frontend
    restart: unless-stopped
    networks:
      - acf_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
