# ACF Workbench demo — demo-acf-project.ard6j1.my.id
# Frontend (static Astro via nginx) dan backend (/api/) berada di container
# acf-frontend / acf-backend pada network laundroops_laundro_net (compose acf).

server {
    listen 80;
    server_name demo-acf-project.ard6j1.my.id;

    # Di atas limit backend (1 MB) supaya payload kebesaran tetap dijawab
    # 400 JSON dari aplikasi, bukan 413 HTML dari Nginx.
    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # CSP di index.astro hanya <meta>, yang tidak dapat menegakkan frame-ancestors.
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'" always;

    location /api/ {
        set $upstream_acf_api http://acf-backend:3001;
        proxy_pass $upstream_acf_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Backend punya timeout outbound 15 detik ke target API.
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        set $upstream_acf_web http://acf-frontend:80;
        proxy_pass $upstream_acf_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
