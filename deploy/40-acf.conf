# ACF Workbench demo — demo-acf-project.ard6j1.my.id
# HTTPS via Cloudflare Origin Certificate (*.ard6j1.my.id) di /etc/nginx/tls/.
# HTTP di-redirect ke HTTPS. Sertifikat berlaku s/d 21 Feb 2027 — perbarui sebelum itu.
# File ini disalin manual ke /srv/edge/conf.d/ (job deploy hanya reload, tidak menyalin).

server {
    listen 80;
    server_name demo-acf-project.ard6j1.my.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name demo-acf-project.ard6j1.my.id;

    ssl_certificate     /etc/nginx/tls/ard6j1-origin.pem;
    ssl_certificate_key /etc/nginx/tls/ard6j1-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Di atas limit backend (1 MB) supaya payload kebesaran tetap dijawab
    # 400 JSON dari aplikasi, bukan 413 HTML dari Nginx.
    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # CSP di index.astro hanya <meta>, yang tidak dapat menegakkan frame-ancestors.
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'" always;

    location /api/ {
        set $upstream_acf_api http://acf-backend:3001;
        proxy_pass $upstream_acf_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Backend punya timeout outbound 15 detik ke target API.
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        set $upstream_acf_web http://acf-frontend:80;
        proxy_pass $upstream_acf_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
