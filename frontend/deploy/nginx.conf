# Nginx untuk demo lokal: menyajikan static Astro dan mem-proxy /api ke container backend.
# Di VPS, blok server ini digantikan konfigurasi reverse proxy yang sudah ada di sana.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Abaikan header keamanan dari upstream agar tidak terduplikasi.
    proxy_hide_header X-Powered-By;

    # Batas body dinaikkan di atas limit backend (1 MB) supaya payload kebesaran
    # tetap dijawab kontrak JSON 400 REQUEST_BODY_TOO_LARGE, bukan 413 HTML dari Nginx.
    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # CSP di index.astro hanya <meta>, yang tidak dapat menegakkan frame-ancestors.
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'" always;

    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Backend punya timeout outbound 15 detik untuk request ke target API.
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /_astro/ {
        # Nama file ber-hash dari Astro, aman di-cache lama.
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
